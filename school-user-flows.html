<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmergenSee — School Emergency User Flows</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    padding: 32px 24px;
    font-size: 13px;
    max-width: 960px;
    margin: 0 auto;
    transition: direction 0.15s;
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
  }
  .top-bar-left { flex: 1; min-width: 0; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #e8eaf0; }
  .subtitle { color: #9095a3; font-size: 13px; }

  .lang-toggle {
    display: flex; align-items: center; gap: 0;
    background: #1c1f2b; border: 1px solid #2a2d38;
    border-radius: 8px; overflow: hidden; flex-shrink: 0;
  }
  .lang-btn {
    padding: 7px 14px; border: none; background: transparent;
    color: #9095a3; cursor: pointer; font-size: 13px; font-weight: 600;
    transition: all 0.15s; letter-spacing: 0.02em;
  }
  .lang-btn:hover { color: #e8eaf0; background: #252836; }
  .lang-btn.active { background: #5b7cf0; color: #fff; }
  .lang-divider { width: 1px; background: #2a2d38; height: 32px; }

  .tab-bar {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .tab {
    padding: 7px 14px; border-radius: 6px; border: 1px solid #2a2d38;
    background: transparent; color: #9095a3;
    cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s;
  }
  .tab:hover { background: #1c1f2b; color: #e8eaf0; }
  .tab.active { background: #5b7cf0; border-color: #5b7cf0; color: #fff; }

  .flow-container { display: none; }
  .flow-container.visible { display: block; }

  .scenario-header {
    display: flex; align-items: flex-start; gap: 14px;
    background: #1c1f2b; border-radius: 10px;
    border: 1px solid #2a2d38;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .scenario-icon { font-size: 30px; flex-shrink: 0; margin-top: 2px; }
  .scenario-title { font-size: 16px; font-weight: 700; color: #e8eaf0; margin-bottom: 4px; }
  .scenario-desc { font-size: 12px; color: #9095a3; line-height: 1.6; }

  .actors { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .actor-badge {
    display: flex; align-items: center; gap: 6px;
    background: #1c1f2b; border: 1px solid #2a2d38;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600;
  }
  .actor-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-admin { background: #f06060; }
  .dot-teacher { background: #f0a440; }
  .dot-student { background: #5b7cf0; }

  .lanes {
    border: 1px solid #2a2d38;
    border-radius: 10px;
    overflow: hidden;
  }
  .lane-header {
    display: grid;
    border-bottom: 1px solid #2a2d38;
  }
  .lane-head-cell {
    padding: 10px 14px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #1c1f2b;
    border-right: 1px solid #2a2d38;
    display: flex; align-items: center; gap: 6px;
  }
  html[dir="rtl"] .lane-head-cell { border-right: none; border-left: 1px solid #2a2d38; }
  .lane-head-cell:last-child { border-right: none; }
  html[dir="rtl"] .lane-head-cell:last-child { border-left: none; }

  .steps-grid { display: grid; }
  .step-row {
    display: grid;
    border-bottom: 1px solid #1e2130;
  }
  .step-row:last-child { border-bottom: none; }
  .step-cell {
    padding: 12px 14px;
    border-right: 1px solid #1e2130;
    min-height: 64px;
  }
  html[dir="rtl"] .step-cell { border-right: none; border-left: 1px solid #1e2130; }
  .step-cell:last-child { border-right: none; }
  html[dir="rtl"] .step-cell:last-child { border-left: none; }
  .step-cell.empty { background: transparent; }

  .step-num {
    font-size: 10px; font-weight: 700; color: #5c6070;
    margin-bottom: 5px; letter-spacing: 0.06em;
  }
  .step-card {
    background: #1c1f2b;
    border-radius: 6px;
    padding: 8px 10px;
    border-left: 3px solid transparent;
    font-size: 11px; line-height: 1.5;
    color: #e8eaf0;
  }
  html[dir="rtl"] .step-card { border-left: none; border-right: 3px solid transparent; }
  html[dir="rtl"] .card-admin { border-right-color: #f06060; border-left: none; }
  html[dir="rtl"] .card-teacher { border-right-color: #f0a440; border-left: none; }
  html[dir="rtl"] .card-student { border-right-color: #5b7cf0; border-left: none; }
  .step-card .action { font-weight: 600; margin-bottom: 3px; }
  .step-card .detail { color: #9095a3; font-size: 10.5px; }
  .card-admin { border-left-color: #f06060; }
  .card-teacher { border-left-color: #f0a440; }
  .card-student { border-left-color: #5b7cf0; }

  .outcome-bar {
    margin-top: 16px;
    background: #1c1f2b;
    border: 1px solid #2a2d38;
    border-radius: 8px; padding: 12px 16px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .outcome-icon { font-size: 20px; flex-shrink: 0; }
  .outcome-label { font-size: 11px; font-weight: 700; color: #48c78e; margin-bottom: 3px; }
  .outcome-text { font-size: 11px; color: #9095a3; line-height: 1.5; }

  html[dir="rtl"] body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Hebrew', 'David', sans-serif; }
  html[dir="rtl"] .step-num { letter-spacing: 0; }
  html[dir="rtl"] .lane-head-cell { letter-spacing: 0; }
</style>
</head>

let currentLang = 'en';
let currentFlow = 0;

function setLang(lang) {
  currentLang = lang;
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'he' ? 'rtl' : 'ltr';

  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-he').classList.toggle('active', lang === 'he');

  const t = translations[lang];
  document.getElementById('main-title').textContent = t.main_title;
  document.getElementById('main-subtitle').textContent = t.main_subtitle;

  document.querySelectorAll('.t[data-key]').forEach(el => {
    const key = el.dataset.key;
    if (t[key] !== undefined) el.textContent = t[key];
  });
}

function show(index) {
  currentFlow = index;
  document.querySelectorAll('.flow-container').forEach((el, i) => {
    el.classList.toggle('visible', i === index);
  });
  document.querySelectorAll('#tab-bar .tab').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
}

// Init
setLang('en');
